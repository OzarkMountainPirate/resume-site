# ── Approach ──────────────────────────────────────────────────────
# First person, factual. These describe how the work is done rather
# than restating what was done.

[[notes]]
title = "Both ends of the ticket"
body  = "I have worked both ends of the service relationship. On a campus I was the person users walked up to; at the MSP I was the person on the other end of the ticket. Ownership and communication matter as much as the fix."

[[notes]]
title = "Rollouts"
body  = "I have led rollouts repeatedly: server migrations, desktop replacement cycles, switch and access point replacements, and full fleet refreshes — including a complete campus network overhaul on a fixed budget and a summer deadline."
