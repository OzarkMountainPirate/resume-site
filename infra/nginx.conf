# ── resume.alcott.dev — static serving ────────────────────────────
# TLS, HSTS, security headers, rate limiting and CrowdSec all happen
# at Traefik. This file only has to serve files correctly.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Zola writes a 404.html; use it rather than nginx's default.
    error_page 404 /404.html;

    # Directory URLs (/experience/) resolve to their index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fingerprint-free assets change on every deploy, so keep the
    # window short enough that a fix is visible the same day.
    location ~* \.(css|js|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /carl-alcott-resume.pdf {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Nothing here should be crawled for hidden files.
    location ~ /\. { deny all; }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
